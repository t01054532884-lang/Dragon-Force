# 웹 플레이 링크 + 개인정보처리방침을 GitHub Pages에 올린다(main에 push할 때마다).
# 처음 한 번: GitHub 저장소 Settings → Pages → Build and deployment → Source를 "GitHub Actions"로.
# 주소: https://t01054532884-lang.github.io/Dragon-Force/ , 처리방침: …/Dragon-Force/privacy.html
name: Deploy web (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
