<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>드래곤 특공대</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0d0f14; overflow: hidden; touch-action: none; }
      #game { width: 100%; height: 100%; }
    </style>
    <script>
      // 테스트 다운로드 링크(?test=1): 굳혀 둔 최신 설치 버전(app/<버전>/)으로 보낸다 → 그 화면에 "다운로드" 버튼.
      // 버전 목록은 Pages 배포가 만든다(scripts/make-install.mjs, .github/workflows/pages.yml). 없으면 그냥 이 화면.
      if (new URLSearchParams(location.search).get('test') === '1') {
        fetch('app/versions.json', { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (v) { if (v && v.latest) location.replace('app/' + v.latest + '/'); })
          .catch(function () {});
      }
    </script>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
