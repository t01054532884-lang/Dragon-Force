# Codemagic: iOS 앱 빌드 → 서명 → TestFlight 업로드 (Mac 없이)
# 게임 파일(dist)을 앱 안에 넣는 방식이라, 게임을 고치면 다시 빌드해서 올려야 한다.
#
# 처음 한 번 할 일 (docs/RELEASE.md 참고)
#   1. Apple Developer: Identifiers에서 Bundle ID com.dragonforce.app 등록
#   2. App Store Connect: 새 앱 '드래곤 특공대' 만들기 → 앱의 Apple ID를 아래 APP_STORE_APPLE_ID에 넣기
#   3. Codemagic: 이 저장소(Dragon-Force)를 앱으로 추가.
#      App Store Connect API 키는 예전 앱들과 같은 계정 키를 Team integrations 이름 그대로 쓴다(아래 integrations).
#      서명은 Codemagic 자동 서명(ios_signing)이 배포 인증서·프로파일을 가져오거나 만든다.
workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: ansimgil_asc # 예전 앱들과 같은 App Store Connect API 키 이름(다르면 Codemagic에 등록한 이름으로 바꾼다)
    environment:
      groups:
        - firebase # Codemagic 앱 환경 변수 그룹: VITE_FIREBASE_API_KEY·AUTH_DOMAIN·PROJECT_ID·APP_ID(웹 앱 DragonForceWeb, 2026-11-24). RevenueCat 키 받으면 VITE_REVENUECAT_IOS_KEY도 여기에
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.dragonforce.app
      vars:
        APP_STORE_APPLE_ID: 6837190960 # App Store Connect "드래곤 특공대" 앱 Apple ID(2026-11-20 생성)
      node: 22
      xcode: latest
    scripts:
      - name: npm 설치
        script: npm ci
      - name: 테스트
        script: npm test
      - name: 게임 빌드(iOS용) + Capacitor 동기화
        script: npm run build:ios
      - name: 서명 프로파일 적용
        script: xcode-project use-profiles --project ios/App/App.xcodeproj
      - name: 빌드 번호 올리기 (TestFlight 최신 + 1)
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          NEXT=$((${LATEST:-0} + 1))
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $NEXT;/g" ios/App/App.xcodeproj/project.pbxproj
          echo "build $NEXT"
      - name: ipa 빌드
        script: xcode-project build-ipa --project "ios/App/App.xcodeproj" --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false # 업로드만. 심사 제출은 제작자가 App Store Connect에서 직접

  # ── 안드로이드(Google Play, 2026-11-26 — google-play 브랜치, 구글플레이/README.md) ──
  # 처음 한 번 할 일(제작자, Codemagic 웹):
  #   1. Team settings → Code signing identities → Android keystores 에 업로드 키(.jks)와 비밀번호·별칭 등록,
  #      참조 이름을 dragonforce_upload 로. (키 파일·비밀번호는 저장소·채팅에 올리지 않는다)
  #   2. 환경 변수 그룹 firebase 에 RevenueCat 안드로이드 공개 키 VITE_REVENUECAT_ANDROID_KEY 추가(결제 켤 때)
  #   3. (선택) Play Console 서비스 계정 JSON 을 그룹 google_play 의 GCLOUD_SERVICE_ACCOUNT_CREDENTIALS 로 등록하면
  #      아래 publishing 주석을 풀어 내부 테스트 트랙에 자동 업로드. 새 앱의 첫 번째 AAB는 Play Console에서 직접 올려야 한다.
  android-play:
    name: Android Google Play
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      groups:
        - firebase
      android_signing:
        - dragonforce_upload
      node: 22
      java: 21
    scripts:
      - name: npm 설치
        script: npm ci
      - name: 테스트
        script: npm test
      - name: 게임 빌드(안드로이드용) + Capacitor 동기화
        script: npm run build:android
      - name: 빌드 번호(versionCode) = Codemagic 빌드 번호 + 100
        script: |
          NEXT=$((BUILD_NUMBER + 100))
          sed -i "s/versionCode [0-9]*/versionCode $NEXT/" android/app/build.gradle
          echo "versionCode $NEXT"
      - name: 서명된 AAB 빌드
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
    # publishing:
    #   google_play:
    #     credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
    #     track: internal
