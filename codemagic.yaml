# Codemagic: iOS 앱 빌드 → 서명 → TestFlight 업로드 (Mac 없이)
# 게임 파일(dist)을 앱 안에 넣는 방식이라, 게임을 고치면 다시 빌드해서 올려야 한다.
#
# 처음 한 번 할 일 (docs/RELEASE.md 참고)
#   1. Apple Developer: Identifiers에서 Bundle ID com.dragonforce.game 등록
#   2. App Store Connect: 새 앱 '드래곤 특공대' 만들기 → 앱의 Apple ID를 아래 APP_STORE_APPLE_ID에 넣기
#   3. Codemagic: 이 저장소(Dragon-Force)를 앱으로 추가.
#      App Store Connect API 키는 예전 앱들과 같은 계정 키를 Team integrations 이름 그대로 쓴다(아래 integrations).
#      서명은 Codemagic 자동 서명(ios_signing)이 배포 인증서·프로파일을 가져오거나 만든다.
workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: ansimgil_asc # 예전 앱들과 같은 App Store Connect API 키 이름(다르면 Codemagic에 등록한 이름으로 바꾼다)
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.dragonforce.game
      vars:
        APP_STORE_APPLE_ID: 0 # TODO: App Store Connect에서 앱을 만든 뒤 그 앱의 Apple ID(숫자)로 바꾸기
      node: 22
      xcode: latest
    scripts:
      - name: npm 설치
        script: npm ci
      - name: 테스트
        script: npm test
      - name: 게임 빌드(iOS용) + Capacitor 동기화
        script: npm run build:ios
      - name: 서명 프로파일 적용
        script: xcode-project use-profiles --project ios/App/App.xcodeproj
      - name: 빌드 번호 올리기 (TestFlight 최신 + 1)
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          NEXT=$((${LATEST:-0} + 1))
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $NEXT;/g" ios/App/App.xcodeproj/project.pbxproj
          echo "build $NEXT"
      - name: ipa 빌드
        script: xcode-project build-ipa --project "ios/App/App.xcodeproj" --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false # 업로드만. 심사 제출은 제작자가 App Store Connect에서 직접
